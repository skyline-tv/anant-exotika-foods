# Reverse proxy for the API. Terminate HTTPS on this host in production
# (for example with Certbot) and proxy to the api service. The Node port
# is not published by docker-compose.
worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  client_max_body_size 8m;
  client_body_timeout 30s;
  client_header_timeout 10s;
  keepalive_timeout 65s;
  send_timeout 30s;

  gzip on;
  gzip_types application/json text/plain text/css application/javascript image/svg+xml;

  upstream api {
    server api:5000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    location = /health {
      proxy_pass http://api;
    }

    location = /ready {
      proxy_pass http://api;
    }

    location /uploads/ {
      alias /usr/share/nginx/uploads/;
      access_log off;
      add_header Cache-Control "public, max-age=86400";
    }

    location / {
      limit_req zone=api burst=80 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 65s;
      proxy_send_timeout 65s;
    }
  }
}
